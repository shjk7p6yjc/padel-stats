<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marcador · Overlay</title>
<style>
html,body{margin:0;background:transparent;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body.preview{background:#3a6b3a linear-gradient(135deg,#2f5d2f,#4b8a4b)}
body.preview::after{content:"Vista previa · en el directo el fondo es transparente";position:fixed;bottom:8px;left:8px;color:#fff;opacity:.7;font-size:12px}
/* Todo escala con el ancho del widget: 1em = ancho/12.5 */
#bug{font-size:calc(100vw / 12.5);display:none;width:100vw}
.box{display:inline-flex;flex-direction:column;background:rgba(10,18,34,.92);color:#fff;border-radius:.35em;overflow:hidden;box-shadow:0 .1em .4em rgba(0,0,0,.35);max-width:100%}
.title{font-size:.42em;letter-spacing:.12em;text-transform:uppercase;padding:.35em .8em .25em;background:rgba(255,255,255,.08);color:#cfd6e4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;align-items:stretch;height:1.45em}
.row+.row{border-top:1px solid rgba(255,255,255,.12)}
.stripe{width:.18em;flex:none}
.srv{width:.75em;flex:none;display:flex;align-items:center;justify-content:center}
.srv i{display:block;width:.36em;height:.36em;border-radius:50%;background:#d7ea2a;box-shadow:0 0 .2em rgba(215,234,42,.8)}
.nm{padding:0 .5em 0 .1em;display:flex;align-items:center;font-weight:700;font-size:.62em;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;min-width:8.5em}
.nm.win::after{content:" ✓";color:#d7ea2a}
.st{width:1.1em;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:.7em;color:#9aa6bd;font-variant-numeric:tabular-nums;position:relative}
.st.w{color:#fff}
.st sup{font-size:.55em;position:absolute;top:.25em;right:.05em;color:#9aa6bd}
.st.cur{color:#fff;font-weight:800;background:rgba(255,255,255,.07)}
.pt{width:1.9em;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.78em;background:#d7ea2a;color:#0a1222;font-variant-numeric:tabular-nums}
.badge{font-size:.42em;font-weight:800;letter-spacing:.1em;padding:.35em .8em;background:#e8442e;color:#fff;text-align:center;text-transform:uppercase}
.badge.soft{background:#d7ea2a;color:#0a1222}
#wait{color:#fff;font-size:14px;padding:8px;opacity:.75;text-shadow:0 1px 3px #000}
</style>
</head>
<body>
<div id="bug"></div>
<div id="wait">Esperando marcador…</div>
<script src="mqtt.min.js"></script>
<script>
"use strict";
const q=new URLSearchParams(location.search);
const code=(q.get('c')||'').replace(/[^a-z0-9]/gi,'');
if(q.get('preview'))document.body.classList.add('preview');
const showTitle=q.get('title')!=='0';
const BROKERS=['wss://broker.hivemq.com:8884/mqtt','wss://broker.emqx.io:8084/mqtt'];
let cur=null;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function last(s){s=String(s||'').trim();const p=s.split(/\s+/);return p.length>1?p[p.length-1]:s}
function render(d){
  const bug=document.getElementById('bug');
  if(!d||!d.teams){return}
  document.getElementById('wait').style.display='none';bug.style.display='block';
  const row=t=>{
    let cells=d.sets.map(s=>{const won=s.g[t]>s.g[1-t];const v=s.stb?s.tb[t]:s.g[t];const sup=s.tb&&!s.stb&&!won?`<sup>${s.tb[t]}</sup>`:'';return`<div class="st ${won?'w':''}">${v}${sup}</div>`}).join('');
    if(!d.done&&!d.stb)cells+=`<div class="st cur">${d.g[t]}</div>`;
    const pt=d.done?'':`<div class="pt">${esc(d.p[t])}</div>`;
    return`<div class="row"><div class="stripe" style="background:${t?'#eb6834':'#2a78d6'}"></div><div class="srv">${d.srvTeam===t?'<i></i>':''}</div><div class="nm ${d.done&&d.winner===t?'win':''}">${esc(last(d.teams[t][0]))} / ${esc(last(d.teams[t][1]))}</div>${cells}${pt}</div>`;
  };
  const badge=d.done?'<div class="badge soft">Final</div>':d.badge?`<div class="badge ${/TIE-BREAK/.test(d.badge)?'soft':''}">${esc(d.badge)}</div>`:'';
  bug.innerHTML=`<div class="box">${showTitle&&d.title?`<div class="title">${esc(d.title)}</div>`:''}${row(0)}${row(1)}${badge}</div>`;
}
function onMsg(topic,buf){
  try{const d=JSON.parse(new TextDecoder().decode(buf));if(!cur||d.ts>=cur.ts){cur=d;render(d)}}catch(e){}
}
if(!code){document.getElementById('wait').textContent='Falta el código del partido en la URL (?c=...)'}
else if(!window.mqtt){document.getElementById('wait').textContent='No se pudo cargar la librería del marcador'}
else{
  const topic='padelstats/v1/'+code+'/score';
  BROKERS.forEach(url=>{
    try{
      const c=mqtt.connect(url,{clientId:'pso_'+Math.random().toString(36).slice(2,10),reconnectPeriod:3000,connectTimeout:10000,clean:true,keepalive:30});
      c.on('connect',()=>c.subscribe(topic,{qos:1}));
      c.on('message',onMsg);
      c.on('error',()=>{});
    }catch(e){}
  });
}
</script>
</body>
</html>
